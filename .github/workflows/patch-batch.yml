# Batch quotidien « dernier patch » : DraftMaster reste toujours au patch en cours.
# 1. Vérifie seulement les numéros (patch Data Dragon + état de public/data : builds, counters, meta) : tools/patch-check.mjs.
# 2. S'ils diffèrent de ceux enregistrés dans l'application, actualise toute la base publiée avec l'app :
#    meilleures drafts (public/data/best-drafts.json) et nouveautés du patch (public/data/patch-notes.json),
#    puis republie le site.
# Champions, objets, runes et sorts (Data Dragon) et parties (relais Riot) sont lus en direct par l'application.
# Tier list, builds et synergies (public/data/builds.json) viennent du batch collect.yml, qui lance ce batch après chaque collecte.
# Aucune clé, aucun secret. Lancement à la main possible (Actions > Batch dernier patch > Run workflow).
name: Batch dernier patch

on:
  schedule:
    - cron: '0 10 * * *'   # 10 h UTC : nouveautés du patch dès que Data Dragon change (la collecte relance ce batch quand elle finit)
    - cron: '0 20 * * *'   # 20 h UTC : rattrape un patch sorti dans la journée
    # Chaque lundi à 8 h heure de Paris : meilleures drafts recalculées même sans nouveau patch.
    # Le cron GitHub est en UTC : 6 h UTC en heure d'été, 7 h UTC en heure d'hiver ; l'étape « Lundi 8 h » garde le bon.
    - cron: '0 6 * * 1'
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: Tout actualiser même si le patch n'a pas changé
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # pour relancer la publication (un commit du bot ne la déclenche pas tout seul)

concurrency:
  group: patch-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lundi 8 h (heure de Paris)
        id: monday
        if: github.event.schedule == '0 6 * * 1' || github.event.schedule == '0 7 * * 1'
        run: |
          # +0200 (été) : le passage de 6 h UTC est le bon ; +0100 (hiver) : celui de 7 h UTC
          off=$(TZ=Europe/Paris date +%z)
          if { [ "$off" = "+0200" ] && [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; } || { [ "$off" = "+0100" ] && [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Recalcul hebdomadaire des meilleures drafts"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Pas 8 h à Paris : on laisse l'autre passage du lundi"
          fi
      - name: Vérifier le numéro de patch
        id: check
        if: steps.monday.outputs.run != 'false'
        env:
          FORCE: ${{ github.event.inputs.force || steps.monday.outputs.run }}
        run: node tools/patch-check.mjs
      - name: Recalculer les meilleures drafts
        if: steps.check.outputs.changed == 'true'
        run: node tools/best-drafts.mjs
      - name: Nouveautés du patch
        if: steps.check.outputs.changed == 'true'
        run: |
          if [ -f tools/patch-notes.mjs ]; then node tools/patch-notes.mjs; else echo "tools/patch-notes.mjs absent, étape sautée"; fi
      - name: Enregistrer et republier
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/data/best-drafts.json
          [ -f public/data/patch-notes.json ] && git add public/data/patch-notes.json
          if git diff --cached --quiet; then echo "Aucun fichier modifié"; exit 0; fi
          git commit -m "Données du patch ${{ steps.check.outputs.ddragon }}"
          git pull --rebase origin main && git push
          gh workflow run deploy.yml --ref main
